name: Generate Custom APK

on:
  repository_dispatch:
    types: [build_app]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Dynamically Update Versions and Config JSON
      run: |
        USER_URL="${{ github.event.client_payload.website_url }}"
        VERSION_CODE="${{ github.event.client_payload.version_code }}"
        VERSION_NAME="${{ github.event.client_payload.version_name }}"
        ORIENTATION="${{ github.event.client_payload.orientation }}"
        AD_NETWORK="${{ github.event.client_payload.ad_network }}"
        ADMOB_ID="${{ github.event.client_payload.admob_id }}"
        STARTIO_ID="${{ github.event.client_payload.startio_id }}"

        # ১. build.gradle ফাইলের প্লেসহোল্ডার ডাইনামিকালি রিপ্লেস করা
        sed -i "s/VERSION_CODE_PLACEHOLDER/$VERSION_CODE/g" app/build.gradle
        sed -i "s/VERSION_NAME_PLACEHOLDER/$VERSION_NAME/g" app/build.gradle

        # ২. আপনার আসল config.json ফাইলটি ব্লগারের ইনপুট দিয়ে আপডেট করা
        mkdir -p app/src/main/assets
        cat <<EOF > app/src/main/assets/config.json
        {
          "app_name": "VDOSky",
          "version": "$VERSION_NAME",
          "website_url": "$USER_URL",
          "ad_network": "$AD_NETWORK",
          "admob_banner_id": "$ADMOB_ID",
          "startio_app_id": "$STARTIO_ID",
          "screen_orientation": "$ORIENTATION"
        }
        EOF

        # ৩. অ্যাপের থিম মিসিং এরর দূর করার জন্য styles.xml তৈরি করা
        mkdir -p app/src/main/res/values
        cat <<EOF > app/src/main/res/values/styles.xml
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <style name="Theme.AppCompat.NoActionBar" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                <item name="colorPrimary">#007bff</item>
                <item name="colorPrimaryDark">#0056b3</item>
                <item name="colorAccent">#007bff</item>
            </style>
        </resources>
        EOF

        # ৪. কালার ফাইল ও ডামি আইকন তৈরি (যদি কোনো কারণে ডিরেক্টরি খালি থাকে)
        cat <<EOF > app/src/main/res/values/colors.xml
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <color name="black">#FF000000</color>
            <color name="white">#FFFFFFFF</color>
        </resources>
        EOF
        
        mkdir -p app/src/main/res/mipmap-hdpi
        echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" | base64 -d > app/src/main/res/mipmap-hdpi/ic_launcher.png
        echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" | base64 -d > app/src/main/res/mipmap-hdpi/ic_launcher_round.png

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Create Gradle Wrapper
      run: gradle wrapper

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    - name: Build Custom Android APK
      run: ./gradlew assembleDebug

    - name: Upload Generated APK
      uses: actions/upload-artifact@v4
      with:
        name: VDOSky-App-v${{ github.event.client_payload.version_name }}
        path: app/build/outputs/apk/debug/*.apk
