name: Generate Custom APK

on:
  repository_dispatch:
    types: [build_app]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Create Missing Android Project Structure & Inject Inputs
      run: |
        USER_URL="${{ github.event.client_payload.website_url }}"
        VERSION_CODE="${{ github.event.client_payload.version_code }}"
        VERSION_NAME="${{ github.event.client_payload.version_name }}"
        ORIENTATION="${{ github.event.client_payload.orientation }}"
        AD_NETWORK="${{ github.event.client_payload.ad_network }}"
        ADMOB_ID="${{ github.event.client_payload.admob_id }}"
        STARTIO_ID="${{ github.event.client_payload.startio_id }}"

        # ১. build.gradle ফাইলে ভার্সন কোড ও নেম পরিবর্তন করা
        sed -i "s/VERSION_CODE_PLACEHOLDER/$VERSION_CODE/g" app/build.gradle
        sed -i "s/VERSION_NAME_PLACEHOLDER/$VERSION_NAME/g" app/build.gradle

        # ২. config.json ফাইলে ডায়নামিক ভ্যালুগুলো ইনজেক্ট করা
        mkdir -p app/src/main/assets
        cat <<EOF > app/src/main/assets/config.json
        {
          "website_url": "$USER_URL",
          "ad_network": "$AD_NETWORK",
          "admob_banner_id": "$ADMOB_ID",
          "startio_app_id": "$STARTIO_ID",
          "screen_orientation": "$ORIENTATION"
        }
        EOF

        # ৩. মিসিং জাভা ডিরেক্টরি এবং MainActivity.java ফাইল তৈরি করা
        mkdir -p app/src/main/java/com/vdosky/app
        cat <<EOF > app/src/main/java/com/vdosky/app/MainActivity.java
        package com.vdosky.app;
        
        import android.os.Bundle;
        import androidx.appcompat.app.AppCompatActivity;

        public class MainActivity extends AppCompatActivity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                // আপনার assets/config.json থেকে ইউজার ইনপুট রিড করার বেসিক লজিক এখানে কাজ করবে
            }
        }
        EOF

        # ৪. মিসিং রিসোর্স ডিরেক্টরি (Mipmap ও Values) তৈরি করা যাতে আইকন বা থিম এরর না আসে
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/mipmap-hdpi

        # ডিফল্ট কালার তৈরি
        cat <<EOF > app/src/main/res/values/colors.xml
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <color name="black">#FF000000</color>
            <color name="white">#FFFFFFFF</color>
        </resources>
        EOF

        # ৫. প্লেসহোল্ডার ডামি আইকন তৈরি (যাতে আইকন মিসিং এরর না আসে)
        echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" | base64 -d > app/src/main/res/mipmap-hdpi/ic_launcher.png
        echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" | base64 -d > app/src/main/res/mipmap-hdpi/ic_launcher_round.png

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Create Gradle Wrapper
      run: gradle wrapper

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    - name: Build Custom Android APK
      run: ./gradlew assembleDebug

    - name: Upload Generated APK
      uses: actions/upload-artifact@v4
      with:
        name: Custom-Web-App-v${{ github.event.client_payload.version_name }}
        path: app/build/outputs/apk/debug/*.apk
