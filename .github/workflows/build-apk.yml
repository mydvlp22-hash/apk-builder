name: Generate Custom APK

on:
  repository_dispatch:
    types: [build_app]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Inject User Inputs into Files
      run: |
        USER_URL="${{ github.event.client_payload.website_url }}"
        VERSION_CODE="${{ github.event.client_payload.version_code }}"
        VERSION_NAME="${{ github.event.client_payload.version_name }}"
        ORIENTATION="${{ github.event.client_payload.orientation }}"
        AD_NETWORK="${{ github.event.client_payload.ad_network }}"
        ADMOB_ID="${{ github.event.client_payload.admob_id }}"
        STARTIO_ID="${{ github.event.client_payload.startio_id }}"

        # build.gradle ফাইলে ভার্সন কোড ও নেম পরিবর্তন করা
        sed -i "s/VERSION_CODE_PLACEHOLDER/$VERSION_CODE/g" app/build.gradle
        sed -i "s/VERSION_NAME_PLACEHOLDER/$VERSION_NAME/g" app/build.gradle

        # config.json ফাইলে ডায়নামিক ভ্যালুগুলো ইনজেক্ট করা
        mkdir -p app/src/main/assets
        cat <<EOF > app/src/main/assets/config.json
        {
          "website_url": "$USER_URL",
          "ad_network": "$AD_NETWORK",
          "admob_banner_id": "$ADMOB_ID",
          "startio_app_id": "$STARTIO_ID",
          "screen_orientation": "$ORIENTATION"
        }
        EOF

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Create Gradle Wrapper
      run: gradle wrapper

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    - name: Build Custom Android APK
      run: ./gradlew assembleRelease

    - name: Upload Generated APK
      uses: actions/upload-artifact@v4
      with:
        name: Custom-Web-App-v${{ github.event.client_payload.version_name }}
        path: app/build/outputs/apk/release/*.apk
